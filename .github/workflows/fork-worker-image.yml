# Fork-only session-finalizer repair. The worker is the only deployed image
# changed; the additive ClickHouse migration must run before replacing it.
name: Fork worker image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/node-app.Dockerfile
          push: true
          build-args: |
            APP=worker
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}/worker:${{ github.sha }}
          cache-from: type=gha,scope=fork-worker
          cache-to: type=gha,mode=max,scope=fork-worker
          provenance: false
