# Fork-only session-finalizer repair. The worker is the only deployed image
# changed; the additive ClickHouse migration must run before replacing it.
name: Fork worker image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Reviewed source commit to build (full 40-character lowercase SHA)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Source commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/node-app.Dockerfile
          push: true
          build-args: |
            APP=worker
            GIT_COMMIT=${{ inputs.source_sha }}
          tags: |
            ghcr.io/${{ github.repository }}/worker:${{ inputs.source_sha }}
          cache-from: type=gha,scope=fork-worker
          cache-to: type=gha,mode=max,scope=fork-worker
          provenance: false
