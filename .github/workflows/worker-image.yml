name: Build 17old Worker Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/node-app.Dockerfile
          push: true
          build-args: |
            APP=worker
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/17old-org/openanalytics-worker:${{ github.sha }}
            ghcr.io/17old-org/openanalytics-worker:sendflare
          cache-from: type=gha,scope=17old-worker
          cache-to: type=gha,mode=max,scope=17old-worker
          provenance: false
